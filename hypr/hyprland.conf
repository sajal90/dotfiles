# Enable for nvidia
#env = LIBVA_DRIVER_NAME,nvidia
#env = XDG_SESSION_TYPE,wayland
#env = GBM_BACKEND,nvidia-drm
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = WLR_NO_HARDWARE_CURSORS,1

# Setup monitors
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,1920x1080@60,0x0,1
# monitor=DP-1,1920x1080@60,1440x0,1.2
# monitor=DP-2,1920x1080@60,1440x0,1.2
# monitor=DP-3,1920x1080@60,0x0,1.2

# Dual monitor example on G15 Strix
# eDP-1 is the built in monitor while DP-1 is external
# Both monitors here are at 1440 and 165Hz
# DP-1 is on the left and  eDP-1 is on the righ
#monitor=DP-1,2560x1440@165,0x0,1
#monitor=eDP-1,2560x1440@165,2560x0,1.25

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch

exec-once = ~/.config/hypr/scripts/xdg-portal-hyprland # Make sure the correct portal is running
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Wayland magic (screen sharing etc.)
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # More wayland magic (screen sharing etc.)
exec-once = /usr/lib/polkit-kde-authentication-agent-1 # used for user sudo graphical elevation
exec-once = waybar # The top bar
#exec-once = blueman-applet # Systray app for BT
#exec-once = nm-applet --indicator # Systray app for Network/Wifi
#exec-once = ~/.config/hypr/scripts/dispatch setupmons
exec-once = ~/.config/hypr/scripts/swayidle & disown
exec-once = swww-daemon
#exec-once = ~/.config/hypr/scripts/wallchange
exec-once = swww img ~/.config/hypr/wallpapers/11.png
exec-once = brillo -U 5

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1

    touchpad {
        disable_while_typing = yes
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    #gaps_in = 7
    gaps_in = 3
    #gaps_out = 10
    gaps_out = 7
    border_size = 1
    #border_size = 3
    col.active_border = rgba(cc33ffee) rgba(3333ffee) 90deg
    #col.active_border = rgb(cdd6f4)
    #col.active_border = 0xffcba6f7
    #col.inactive_border = rgba(595959aa)

    layout = dwindle
}

misc {
    disable_hyprland_logo = yes
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5

    blur {
        enabled = false
        #enabled = true
        size = 2
        #size = 4
        passes = 3
        new_optimizations = true
   }

    blurls = lockscreen

#    drop_shadow = yes
#    shadow_range = 4
#    shadow_render_power = 3
#    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.10, 0.9, 0.1, 1.05

    animation = windows, 1, 10, myBezier, slide
    animation = windowsOut, 1, 7, myBezier, slide
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mod + P in the keybinds section below
    force_split = 2
    preserve_split = yes # you probably want this
    smart_resizing = yes
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#    new_is_master = false
    mfact = 0.5
    new_on_top = false
    orientation = left
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device:epic mouse V1 {
#    sensitivity = -0.5
#}

# Example windowrule v1
#windowrule = float, ^(alacritty)$
#windowrule = float,^(pavucontrol)$
#windowrule = float,^(blueman-manager)$
#windowrule = float,^(nm-connection-editor)$
#windowrule = float,^(thunar)$
#windowrule = float,^(file-roller)$
#windowrule = float,title:^(btop)$
##windowrule = float,^(google-chrome|Google-chrome)$
##windowrule = float,^(Steam|steam)$
#windowrule = float,^(Gitk|gitk)$
#windowrule = float,^(rofi)$


# Example windowrule v2
# windowrulev2 = float,class:^(alacritty)$,title:^(alacritty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# rules below would make the specific app transparent
windowrule = animation popin,class:^(thunar)$
windowrule = opacity 1.0 0.8,class:^(thunar)$
windowrule = opacity 1.0 0.8,class:^(alacritty)$
#windowrule = animation popin,class:^(google-chrome|Google-chrome)$
windowrule = animation popin,class:^(zen-browser)$
windowrule = animation popin,class:^(google-chrome|Google-chrome)$,title:^(Open File)$
windowrule = animation slide,class:^(rofi)$
windowrule = move 100%-433 53,class:^(rofi)$,title:^(clippick)$

#windowrulev2 = float, class:^(mpv)$
#windowrulev2 = pin, class:^(mpv)$

# VirtualBox window rules
#windowrulev2 = float,title:^(VirtualBox \- Preferences)$
#windowrulev2 = center,title:^(VirtualBox \- Preferences)$
#windowrulev2 = float,class:^(VirtualBox)$,title:.*(Settings)$
#windowrulev2 = center,class:^(VirtualBox)$,title:.*(Settings)$


#windowrule = float, com-group_finity-mascot-Main
#windowrule = noblur, com-group_finity-mascot-Main
#windowrule = nofocus, com-group_finity-mascot-Main
#windowrule = noshadow, com-group_finity-mascot-Main

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
binds {
    workspace_back_and_forth = yes
}


bind = $mod, RETURN, exec, alacritty  # open the terminal
bind = ALT, RETURN, exec,gnome-terminal # opens gnome terminal
bind = $mod SHIFT, C, killactive, # close the active window
bind = $mod, A, exec, code
bind = $mod SHIFT, A, exec, idea
#bind = CTRL ALT, DELETE, exec, swaylock # Lock the screen
bind = $mod, W, exec, [workspace 1 silent]zen-browser #Open web browser
#bind = $mod, M, exec, wlogout --protocol layer-shell # show the logout window
bind = $mod SHIFT, M, exit, # Exit Hyprland all together no (force quit Hyprland)
bind = $mod, V, togglefloating, # Allow a window to float
bind = $mod SHIFT, V, exec, hyprctl dispatch workspaceopt allfloat
bind = $mod, Z, exec, ~/.config/rofi/launchers/type-7/launcher.sh # Show the graphical app launcher
bind = $mod, P, pseudo, # dwindle
bind = $mod, T, togglesplit, # dwindle
#bind = ,Print, exec, ~/.config/hypr/scripts/screenshot # take screenshot
bind = $mod, S, fullscreen, 1
bind = $mod, F, fullscreen
bind = $mod SHIFT, S, exec, ~/.config/hypr/scripts/ss #take screenshot
bind = $mod, B, exec, ~/.config/hypr/scripts/waybarToggle
bind = $mod, M, exec, bemenu-run -H 35 --hp 10 --fn 'JetBrains Mono Nerd [14]'
#bind = $mod, C, exec, ~/.config/hypr/scripts/diffwall n
#bind = $mod, N, exec, ~/.config/hypr/scripts/diffwall
bind = $mod, L, pin
bind = $mod ,Up,exec,busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateTemperature n -500
bind = $mod ,Down,exec,busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateTemperature n +500
bind = $mod, U, exec, playerctl -p mpv, next
bind = $mod, Y, exec, playerctl -p mpv, previous
bind = $mod, Q, exec, ~/.config/hypr/scripts/wcode
bind = $mod SHIFT, Q, exec, ~/.config/hypr/scripts/codeRun
bind = $mod, E, exec, ~/.config/waybar/scripts/startmpv p
bind = $mod ,R, exec, hyprctl keyword "device[dell08b8:00-0488:121f-touchpad]:enabled" false
bind = $mod SHIFT, R, exec, hyprctl keyword "device[dell08b8:00-0488:121f-touchpad]:enabled" true
#
#


# Work around for minimizing an application
bind = $mod, D, movetoworkspacesilent, special
bind = $mod, X,togglespecialworkspace 
bind = $mod SHIFT, X,movetoworkspace, e+0
bind = $mod SHIFT, X,togglespecialworkspace


# Move focus with mod + arrow keys
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = ALT, H, swapwindow, l
bind = ALT, L, swapwindow, r
bind = ALT, J, swapwindow, d
bind = ALT, K, swapwindow, u


# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Switch workspaces with alt and arrow keys
bind = $mod, right, workspace, +1
bind = $mod, left,  workspace, -1


# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_down, workspace, +1
bind = $mod, mouse_up, workspace, -1
bind = ,mouse:276, workspace, +1
bind = ,mouse:275, workspace, -1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Move windows around
bind=$mod SHIFT, J, layoutmsg,orientationtop
bind=$mod SHIFT, L, layoutmsg,orientationleft

# Media controls
binde =, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume --inc
binde =, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume --dec
binde =, XF86AudioMute, exec, ~/.config/hypr/scripts/volume --toggle
binde =, XF86AudioMicMute, exec, ~/.config/hypr/scripts/volume --toggle-mic
binde =, XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness --inc
binde =, XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness --dec

# Move workspace to another monitor. Monitors are numberd 1, 2, and so on...
#bind = $mod SHIFT, F1, exec, ~/.config/hypr/scripts/dispatch movecurrentworkspacetomonitor -m 1
#bind = $mod SHIFT, F2, exec, ~/.config/hypr/scripts/dispatch movecurrentworkspacetomonitor -m 2
#bind = $mod SHIFT, F3, exec, ~/.config/hypr/scripts/dispatch movecurrentworkspacetomonitor -m 3

# Source a file (multi-file configs)
source = ~/.config/hypr/workspaces.conf
